<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - Mohammed Sayed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-block;
            padding: 6px 12px;
            background: rgba(102,126,234,0.1);
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #667eea;
            color: white;
            transform: translateX(-3px);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            margin-top: 20px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .url-input, .referer-input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .url-input:focus, .referer-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .fetch-btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .fetch-btn:hover {
            background: #5a67d8;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .video-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .video-info img {
            max-width: 100%;
            border-radius: 10px;
        }
        
        .download-btn {
            width: 100%;
            padding: 12px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .error {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        
        .footer-note {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://mos238.github.io/myWebSite/" class="back-link">← Back to Portfolio</a>
        
        <h1>🎥 Video Downloader</h1>
        <p class="subtitle">Download YouTube videos or M3U8 streams</p>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('youtube')">YouTube Downloader</button>
            <button class="tab" onclick="switchTab('m3u8')">M3U8 Stream Downloader</button>
        </div>
        
        <!-- YouTube Tab -->
        <div id="youtube" class="tab-content active">
            <input type="text" id="youtubeUrl" class="url-input" placeholder="https://www.youtube.com/watch?v=..." />
            <button onclick="fetchYouTubeInfo()" class="fetch-btn">Get Video Info</button>
            
            <div class="loading" id="youtubeLoading">
                <div class="spinner"></div>
                <p>Fetching video information...</p>
            </div>
            
            <div class="error" id="youtubeError"></div>
            <div class="video-info" id="youtubeInfo"></div>
        </div>
        
        <!-- M3U8 Tab -->
        <div id="m3u8" class="tab-content">
            <input type="text" id="m3u8Url" class="url-input" placeholder="https://example.com/stream.m3u8" />
            <input type="text" id="refererUrl" class="referer-input" placeholder="Referer URL (optional - for protected streams)" />
            <div class="info-text">💡 Some streams need a Referer URL. Copy the webpage URL where you found the stream.</div>
            <button onclick="downloadM3U8()" class="fetch-btn">Download M3U8 Stream</button>
            
            <div class="loading" id="m3u8Loading">
                <div class="spinner"></div>
                <p>Downloading stream...</p>
            </div>
            
            <div class="error" id="m3u8Error"></div>
        </div>
        
        <div class="footer-note">
            💡 Free tool by Mohammed Sayed | <a href="https://mos238.github.io/myWebSite/" style="color: #667eea;">Visit Portfolio</a>
        </div>
    </div>
    
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }
        
        async function fetchYouTubeInfo() {
            const url = document.getElementById('youtubeUrl').value;
            if (!url) {
                showError('youtubeError', 'Please enter a YouTube URL');
                return;
            }
            
            showLoading('youtubeLoading', true);
            hideError('youtubeError');
            
            try {
                const response = await fetch('/get-info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayYouTubeInfo(data);
                } else {
                    showError('youtubeError', data.error || 'Failed to fetch video info');
                }
            } catch (error) {
                showError('youtubeError', 'Network error. Please try again.');
            } finally {
                showLoading('youtubeLoading', false);
            }
        }
        
        function displayYouTubeInfo(data) {
            const infoDiv = document.getElementById('youtubeInfo');
            infoDiv.innerHTML = `
                <img src="${data.thumbnail}" alt="Thumbnail">
                <h3>${data.title}</h3>
                <select id="formatSelect">
                    ${data.formats.map(f => `<option value="${f.format_id}">${f.quality} - ${f.ext}</option>`).join('')}
                </select>
                <button class="download-btn" onclick="downloadYouTube()">Download Video</button>
            `;
            infoDiv.style.display = 'block';
        }
        
        async function downloadYouTube() {
            const url = document.getElementById('youtubeUrl').value;
            const formatId = document.getElementById('formatSelect').value;
            
            const response = await fetch('/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url, format_id: formatId})
            });
            
            if (response.ok) {
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'video.mp4';
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
            }
        }
        
        async function downloadM3U8() {
            const url = document.getElementById('m3u8Url').value;
            const referer = document.getElementById('refererUrl').value;
            
            if (!url) {
                showError('m3u8Error', 'Please enter an M3U8 URL');
                return;
            }
            
            showLoading('m3u8Loading', true);
            hideError('m3u8Error');
            
            try {
                const response = await fetch('/download-m3u8', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url, referer: referer})
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'video.mp4';
                    a.click();
                    window.URL.revokeObjectURL(downloadUrl);
                    showError('m3u8Error', 'Download started! Check your downloads folder.');
                    setTimeout(() => hideError('m3u8Error'), 3000);
                } else {
                    const error = await response.json();
                    showError('m3u8Error', error.error || 'Download failed. Please check the URL.');
                }
            } catch (error) {
                showError('m3u8Error', 'Network error. Please try again.');
            } finally {
                showLoading('m3u8Loading', false);
            }
        }
        
        function showLoading(id, show) {
            document.getElementById(id).style.display = show ? 'block' : 'none';
        }
        
        function showError(id, message) {
            const errorDiv = document.getElementById(id);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function hideError(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
